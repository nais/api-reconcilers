name: Check, build and deploy
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
env:
  NAME: nais-api-reconcilers
  IMAGE_REPOSITORY: oci://europe-north1-docker.pkg.dev/nais-io/nais
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  version-info:
    outputs:
      go-version: ${{ steps.go-version.outputs.version }}
    name: Get version info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # ratchet:jdx/mise-action@v5
      - id: go-version
        run: echo "version=$(mise current go)" >> $GITHUB_OUTPUT

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mise-task:
          - test
          - check:deadcode
          - check:gosec
          - check:helm-lint
          - check:ratchet
          - check:staticcheck
          - check:govulncheck
          - check:govet
          - fmt:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # ratchet:jdx/mise-action@v5
      - run: mise run ${{ matrix.mise-task }}

  build-push:
    needs:
      - version-info
      - check
    outputs:
      chart-version: ${{ steps.package-chart.outputs.version }}
    permissions:
      contents: read
      id-token: write
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # ratchet:jdx/mise-action@v5
      - uses: nais/platform-build-push-sign@0f74f19fb291a0563f7d30e23fb83de3c4c7c851 # ratchet:nais/platform-build-push-sign@main
        id: build-push-sign
        with:
          name: ${{ env.NAME }}
          build_args: |
            GO_VERSION=${{ needs.version-info.outputs.go-version }}-
          google_service_account: gh-api-reconcilers
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push: true
      - name: Package chart
        id: package-chart
        env:
          CHART_PATH: ./charts
        run: |
          base_version="$(yq '.version' < "${{ env.CHART_PATH }}/Chart.yaml")"
          chart_version="${base_version}-${{ steps.build-push-sign.outputs.version }}"

          yq eval \
            '.version="'"$chart_version"'"' \
            "${{ env.CHART_PATH }}/Chart.yaml" --inplace
          yq eval \
            '.image.tag="${{ steps.build-push-sign.outputs.version }}"' \
            "${{ env.CHART_PATH }}/values.yaml" --inplace

          helm package "${{ env.CHART_PATH }}" --destination .

          name=$(yq '.name' < "${{ env.CHART_PATH }}/Chart.yaml")
          echo "name=$name" >> $GITHUB_OUTPUT
          echo "version=$chart_version" >> $GITHUB_OUTPUT
          echo "archive=$name-$chart_version.tgz" >> $GITHUB_OUTPUT
      - name: Push Chart
        run: |-
          chart="${{ steps.package-chart.outputs.archive }}"
          echo "Pushing: $chart"
          helm push "$chart" ${{ env.IMAGE_REPOSITORY }}

  # Used by GitHub to determine if all checks and builds have passed.
  branch-protection-checkpoint:
    runs-on: ubuntu-latest
    needs: [check, build-push]
    if: ${{ always() }}
    steps:
      - if: ${{ needs.check.result != 'success' || needs.build-push.result != 'success' }}
        run: exit 1
      - run: echo "All checks and builds passed."

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: fasit-deploy
    permissions:
      id-token: write
    needs:
      - build-push
      - branch-protection-checkpoint
    steps:
      - uses: nais/fasit-deploy@53e433b1bdd08fc622e03a78584c0832c9083bd3 # ratchet:nais/fasit-deploy@v4
        with:
          chart: ${{ env.IMAGE_REPOSITORY }}/${{ env.NAME }}
          version: ${{ needs.build-push.outputs.chart-version }}
          targets: |
            [
              { "target": { "kind": "management", "tenant": "ci-nais" }, "wait": true },
              { "target": { "kind": "management" } }
            ]
